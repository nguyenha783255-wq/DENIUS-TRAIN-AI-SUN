services:
  - type: web
    name: denius-train-ai-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: denius-train-ai-db
          property: connectionString
      - key: SOURCE_URL
        value: https://kwinstore.com/sunwin/tx/history/b54b32ca9f748d5dbe64f421f14f1f04fa8d30012b17d0f5

  - type: worker
    name: denius-train-ai-worker
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: denius-train-ai-db
          property: connectionString
      - key: SOURCE_URL
        value: https://kwinstore.com/sunwin/tx/history/b54b32ca9f748d5dbe64f421f14f1f04fa8d30012b17d0f5
      - key: POLL_SECONDS
        value: "15"
      - key: RETRAIN_EVERY_NEW
        value: "100"
      - key: MIN_TRAIN_ROWS
        value: "500"

databases:
  - name: denius-train-ai-db
    plan: 0.1c-256mb
    diskSizeGB: 10
    databaseName: denius_ai
    user: denius_ai
